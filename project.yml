name: PhotoSeekiOS
options:
  bundleIdPrefix: com.rafa.photoseek
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  PhotoSeek:
    path: .

targets:
  PhotoSeekiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/PhotoSeekiOS
        excludes:
          - "Resources/**"
      - path: Sources/PhotoSeekiOS/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Sources/PhotoSeekiOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: DejaVi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: DejaVi needs access to your photo library to index and search your photos.
        NSPhotoLibraryAddUsageDescription: DejaVi needs permission to create albums and organize your photos.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafa.dejavi
        PRODUCT_NAME: DejaVi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Sources/PhotoSeekiOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    dependencies:
      - package: PhotoSeek
        product: PhotoSeekCore
